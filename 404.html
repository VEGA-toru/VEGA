<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Сторінку не знайдено — VEGA-ТУР</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg:#12100e; --card:#1c1815; --gold:#c9a227; --text:#f2ede4; --muted:#a89e8f; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%, #241f19 0%, var(--bg) 60%);
    color:var(--text); font-family:"Work Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:24px; text-align:center;
  }
  .card { max-width:520px; width:100%; background:var(--card); border:1px solid rgba(201,162,39,.18);
          border-radius:18px; padding:40px 28px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  .code { font-size:clamp(64px,18vw,96px); line-height:1; margin:0; color:var(--gold);
          font-family:"Fraunces",Georgia,serif; letter-spacing:.02em; }
  h1 { font-size:22px; margin:16px 0 8px; font-weight:600; }
  p { color:var(--muted); font-size:15px; line-height:1.55; margin:0 0 26px; }
  .acts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a.btn { display:inline-block; padding:13px 20px; border-radius:10px; text-decoration:none;
          font-size:15px; font-weight:600; }
  a.primary { background:var(--gold); color:#191510; }
  a.ghost { border:1px solid rgba(201,162,39,.45); color:var(--gold); }
  a.btn:hover { opacity:.9; }
  .foot { margin-top:26px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Такої сторінки немає</h1>
    <p>Можливо, посилання застаріло або в адресі помилка. Але тури нікуди не поділися — оберіть напрямок на головній.</p>
    <div class="acts">
      <a class="btn primary" href="/">На головну</a>
      <a class="btn ghost" href="tel:+380674296132">Подзвонити</a>
      <a class="btn ghost" href="https://t.me/gagarin2080">Telegram</a>
    </div>
    <p class="foot">VEGA-ТУР · Трускавець · <a href="tel:+380502278002" style="color:inherit">+380 50 227 80 02</a></p>
  </main>
</body>
</html>
